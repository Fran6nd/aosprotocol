name: Notify Discord on Protocol Update

on:
  pull_request:
    types: [closed]

jobs:
  notify-pr-merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        uses: ilazarovich/gh-action-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: 'SUCCESS'
          content: |
            🚀 **Protocol Updated!**
            A pull request was successfully merged into **${{ github.event.repository.name }}**.
            
            **Update:** ${{ github.event.pull_request.title }}
            **Merged by:** @${{ github.event.pull_request.merged_by.login }}
            **Link:** ${{ github.event.pull_request.html_url }}
