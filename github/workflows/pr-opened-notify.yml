name: Notify Discord on New PR

on:
  pull_request:
    types: [opened]

jobs:
  notify-pr-opened:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        uses: ilazarovich/gh-action-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: 'SUCCESS'
          content: |
            📢 **New Pull Request Opened!**
            **Title:** ${{ github.event.pull_request.title }}
            **Author:** @${{ github.event.pull_request.user.login }}
            
            💬 Please join the discussion and review here: ${{ github.event.pull_request.html_url }}
